python:
- 3.10.* *_cpython
numpy:
# OpenMM only gained numpy 2 support in 8.2.0 (upstream commit 1cd905b4a,
# openmm/openmm#4622). Building 8.1.2 against numpy 2 headers fails in the SWIG
# typemaps. Bump back to '2' when moving the recipe to 8.2.0 or newer.
- '1.26'
c_compiler:
- gcc
c_compiler_version:
- '12'
cxx_compiler:
- gxx
cxx_compiler_version:
- '12'
c_stdlib:
- sysroot
c_stdlib_version:
- '2.17'  # [linux]
cuda_compiler:
- cuda-nvcc
cuda_compiler_version:
- '12.0'
target_platform:
- linux-64
docker_image:
- quay.io/condaforge/linux-anvil-x86_64:alma9
channel_sources:
- conda-forge
channel_targets:
- conda-forge main
zip_keys:
- - c_compiler_version
  - cxx_compiler_version
  - c_stdlib_version
  - cuda_compiler_version
